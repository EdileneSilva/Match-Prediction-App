# =============================================================================
# Match Prediction App - Docker Compose Configuration
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: match-prediction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Data/docker-entrypoint-initdb.d/01-create-footballapp-db.sql:/docker-entrypoint-initdb.d/01-create-footballapp-db.sql:ro
      - ./Data/docker-entrypoint-initdb.d/02-create-footballml-db.sql:/docker-entrypoint-initdb.d/02-create-footballml-db.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - match-prediction-network

  app-api:
    build:
      context: .
      dockerfile: FastAPI_App/Dockerfile
    container_name: match-prediction-app-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/footballapp_db
      - DATABASE_APP_URL=postgresql://postgres:postgres@postgres:5432/footballapp_db
      - ML_API_URL=http://ml-api:8001
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-me}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    env_file:
      - .env
    volumes:
      - ./FastAPI_App/app:/app/app:ro
      - ./Data:/app/Data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - match-prediction-network

  ml-api:
    build:
      context: .
      dockerfile: FastAPI_ML/Dockerfile
    container_name: match-prediction-ml-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/footballml_db
      - DATABASE_ML_URL=postgresql://postgres:postgres@postgres:5432/footballml_db
      - DATA_DIR=/app/Data/dataset
      - MODEL_PATH=/app/Data/dataset/match_model_v1.joblib
      - DATASET_PATH=/app/Data/dataset/completed_match_dataset_final.csv
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    env_file:
      - .env
    volumes:
      - ./FastAPI_ML/app:/app/app:ro
      - ./Data:/app/Data
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - match-prediction-network

  frontend:
    build:
      context: ./match_prediction_app-front
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: match-prediction-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    depends_on:
      app-api:
        condition: service_healthy
      ml-api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - match-prediction-network

volumes:
  postgres_data:
    name: match-prediction-postgres-data

networks:
  match-prediction-network:
    name: match-prediction-network
    driver: bridge
